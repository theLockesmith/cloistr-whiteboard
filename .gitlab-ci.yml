stages:
  - test
  - build
  - smoke

include:
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/kaniko-build.yml'
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/frontend-smoke.yml'
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/cloistr-rules.yml'

# Run the vitest suite. Until now this repo had no test stage at all, so
# `npm test` (36 vitest tests, four files) had never executed in CI once.
#
# `extends: .cloistr-rules` is REQUIRED, not decorative. Without it this job is
# silently dropped from every merge-request pipeline: an in-repo job with no
# `rules:` falls back to `only: [branches, tags]`, and an MR pipeline is
# neither, so the job is not created at all. No error, no skipped badge.
#
# Image and install flags mirror this repo's own Dockerfile exactly
# (node:22.23.2-alpine, `npm install -g npm@11 --quiet` then plain `npm ci`,
# no --legacy-peer-deps here). Verified in that image: npm 11.19.1, 36/36 pass.
# Do not "simplify" this to a different node tag or a different npm major -
# npm 10 rejects lockfiles that omit optional peer deps, the deadlock that
# held docs/sheets/whiteboard on a stale bundle for a week.
test:frontend:
  extends: .cloistr-rules
  stage: test
  image: node:22.23.2-alpine
  script:
    - npm install -g npm@11 --quiet
    - npm ci
    - npm test

build:
  extends: .kaniko-build
  stage: build
  variables:
    KANIKO_EXTRA_FLAGS: "--build-arg=NPM_TOKEN=${CI_JOB_TOKEN}"

# Smoke-test: load built image in real Chromium, fail on console errors / blank page
smoke-test:
  extends: .smoke-test
  needs: ["build"]
